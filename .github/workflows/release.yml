name: Release

# A merge of develop into main makes a release. The version comes from the bump markers of the commits (see
# scripts/version.py). The workflow tags the commit of develop, creates a GitHub Release with the jar and the release
# notes, publishes the jar to GitHub Packages (Maven), then publishes the jar, the sources jar and the Javadoc jar to
# Modrinth. The Maven of Modrinth gives these files with no token, for the mods that use the API of Cartofold. The
# release comes first: a Maven version is immutable, so a failed release step can run again only when the publication
# did not happen.
# The steps of Modrinth need the secret MODRINTH_TOKEN (scopes VERSION_CREATE and PROJECT_WRITE). A fork skips these
# steps. An error on the page of the project does not stop the release.
# The workflow has one job for each step: build and test, GitHub Release, GitHub Packages, Modrinth and the
# documentation site.
# When the tag of the version exists, the workflow makes no release. To run it again after a failure, use
# "Run workflow" on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.value }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      # A merge of develop has two parents: the second parent is the commit of develop. The tag goes on it, so develop
      # contains the tags of the releases.
      - name: Find the commit of develop
        id: commit
        run: |
          commit=$(git rev-parse HEAD)
          if git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            commit=$(git rev-parse 'HEAD^2')
          fi
          if ! git diff --quiet HEAD "$commit"; then
            echo "The files of main and of the commit $commit of develop are different. Merge main into develop." >&2
            exit 1
          fi
          echo "value=$commit" >> "$GITHUB_OUTPUT"

      - name: Calculate the version
        id: version
        env:
          COMMIT: ${{ steps.commit.outputs.value }}
        run: |
          python3 scripts/version.py version --rev "$COMMIT" --github-output build-version.txt
          cat build-version.txt >> "$GITHUB_OUTPUT"
          tag=$(sed -n 's/^tag=//p' build-version.txt)
          if [ "$(sed -n 's/^exists=//p' build-version.txt)" = true ]; then
            echo "The tag \`${tag}\` exists: no release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release: \`${tag}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build and test
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Build, unit tests and translation check
        run: ./gradlew build -Pmod_version="$VERSION" --stacktrace

      - name: GameTest server
        run: ./gradlew runGameTestServer -Pmod_version="$VERSION" --stacktrace

      - name: Upload the jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartofold-mod
          path: build/libs/cartofold-*.jar
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.version.outputs.commit }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the release notes.
          fetch-depth: 0

      - name: Download the jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cartofold-mod
          path: build/libs

      - name: Write the release notes
        run: python3 scripts/version.py version --rev "$COMMIT" --repo "$GITHUB_REPOSITORY" --notes build/release-notes.md

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartofold-release-notes
          path: build/release-notes.md
          if-no-files-found: error

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" "build/libs/cartofold-${VERSION}.jar" \
            --target "$COMMIT" \
            --title "Cartofold ${VERSION}" \
            --notes-file build/release-notes.md

  github-packages:
    name: GitHub Packages
    needs: [version, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Publish to GitHub Packages
        run: ./gradlew publish -Pmod_version="$VERSION" --stacktrace
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  modrinth:
    name: Modrinth
    needs: [version, github-release]
    if: github.repository_owner == 'nicolas-goyon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cartofold-mod
          path: build/libs

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cartofold-release-notes
          path: build

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/modrinth.py publish --version "$VERSION" --notes build/release-notes.md

      - name: Update the page on Modrinth
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/modrinth.py project --body docs/modrinth.md --icon src/main/resources/cartofold_logo.png

  pages:
    name: Documentation site
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The workflow Pages runs on develop: GitHub Pages accepts a deployment from the default branch.
      - name: Start the workflow Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref develop

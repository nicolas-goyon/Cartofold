name: Build

# Builds the mod and runs the tests, each in its own job. Each build has a version from scripts/version.py:
# - push on develop: the version of the commit, then "-dev." and the short commit. Example: 0.2.0-dev.13bcc38.
# - pull request: the version after the merge, then "-pr.", the number and the short commit. Example:
#   0.2.1-pr.12.abc1234.
# - push on main: the version of the release.
# When all the jobs pass, a build of develop goes to Modrinth as an alpha. A fork skips this job.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push on a pull request cancels the run of the earlier push. A push on main or develop is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      - name: Calculate the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          short=$(git rev-parse --short=7 "$HEAD_SHA")
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ]; then
            version="$(python3 scripts/version.py version --rev "$HEAD_SHA")-pr.${NUMBER}.${short}"
          elif [ "$EVENT" = pull_request ]; then
            base=$(python3 scripts/version.py version --rev "$BASE_SHA" --title "$TITLE" --author "$AUTHOR")
            version="${base}-pr.${NUMBER}.${short}"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            version=$(python3 scripts/version.py version --rev HEAD)
          else
            version="$(python3 scripts/version.py version --rev HEAD)-dev.${short}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version of this build: \`${version}\`." >> "$GITHUB_STEP_SUMMARY"

  scripts:
    name: Tests of the scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  build:
    name: Build
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Compile, and check the format and the translations
        run: >-
          ./gradlew assemble compileGametestJava spotlessCheck checkTranslations
          -Pmod_version="$VERSION" --stacktrace

      - name: Upload the jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartofold-mod
          path: build/libs/cartofold-*.jar
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Run the unit tests
        run: ./gradlew test -Pmod_version="$VERSION" --stacktrace

  gametests:
    name: GameTests
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Run the GameTest server
        run: ./gradlew runGameTestServer -Pmod_version="$VERSION" --stacktrace

      - name: Upload the logs of the GameTest server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartofold-gametest-logs
          path: run-gametest/logs
          if-no-files-found: ignore

  publish-dev:
    name: Publish the dev build
    needs: [version, scripts, build, unit-tests, gametests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository_owner == 'nicolas-goyon'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cartofold-mod
          path: build/libs

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git log -1 --format='%s%n%n%b' > build/dev-notes.md
          python3 scripts/modrinth.py publish --version "$VERSION" --notes build/dev-notes.md --type alpha

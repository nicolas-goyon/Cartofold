name: Build

# Builds the mod and runs the tests. Each build has a version from scripts/version.py:
# - push on develop: the version of the commit, then "-dev." and the short commit. Example: 0.2.0-dev.13bcc38.
# - pull request: the version after the merge, then "-pr.", the number and the short commit. Example:
#   0.2.1-pr.12.abc1234.
# - push on main: the version of the release.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push on a pull request cancels the run of the earlier push. A push on main or develop is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the version.
          fetch-depth: 0

      - name: Calculate the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          short=$(git rev-parse --short=7 "$HEAD_SHA")
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = main ]; then
            version="$(python3 scripts/version.py version --rev "$HEAD_SHA")-pr.${NUMBER}.${short}"
          elif [ "$EVENT" = pull_request ]; then
            base=$(python3 scripts/version.py version --rev "$BASE_SHA" --title "$TITLE" --author "$AUTHOR")
            version="${base}-pr.${NUMBER}.${short}"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            version=$(python3 scripts/version.py version --rev HEAD)
          else
            version="$(python3 scripts/version.py version --rev HEAD)-dev.${short}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version of this build: \`${version}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Tests of the scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, unit tests, format and translation checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -Pmod_version="$VERSION" --stacktrace

      - name: GameTest server
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew runGameTestServer -Pmod_version="$VERSION" --stacktrace

      - name: Upload the logs of the GameTest server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartofold-gametest-logs
          path: run-gametest/logs
          if-no-files-found: ignore

      - name: Upload the mod jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cartofold-mod
          path: |
            build/libs/cartofold-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

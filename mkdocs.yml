site_name: Cartofold
site_description: One map engine for the minimap, the world map, the paper maps and the maps of the other mods.
site_url: https://nicolas-goyon.github.io/Cartofold/
repo_url: https://github.com/nicolas-goyon/Cartofold
repo_name: nicolas-goyon/Cartofold
edit_uri: edit/develop/docs/
strict: true

exclude_docs: |
  modrinth.md

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: green
      toggle:
        icon: material/weather-night
        name: Use the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Use the light theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
      dedent_subsections: true

nav:
  - Home: index.md
  - Player guide:
      - Install: guide/install.md
      - Minimap and map of the world: guide/maps.md
      - Waypoints and banners: guide/waypoints.md
      - Survey maps: guide/survey-maps.md
      - Keys and settings: guide/settings.md
  - Mod developers:
      - API guide: api.md
      - API examples: api-examples.md
      - API reference: api-reference.md
      - Javadoc: https://nicolas-goyon.github.io/Cartofold/javadoc/io/github/nicolasgoyon/cartofold/api/package-summary.html
  - Technical:
      - Architecture: technical/architecture.md
      - Design: design.md
  - Release notes: release-notes.md
  - Modrinth: https://modrinth.com/project/cartofold

extra:
  social:
    - icon: simple/modrinth
      link: https://modrinth.com/project/cartofold
      name: Cartofold on Modrinth
    - icon: fontawesome/brands/github
      link: https://github.com/nicolas-goyon/Cartofold
      name: Cartofold on GitHub
